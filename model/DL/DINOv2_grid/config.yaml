# 모델·실험 설정 (명세 v0.1). 모든 e-스크립트가 이 파일 하나에서 파라미터를 읽는다 (하드코딩 금지).
# 상대경로는 이 config 파일이 있는 폴더(exp_grid/) 기준. '~' 는 사용자 홈으로 확장.
# 용어 (사용자 확인): 1단계 폴더 = 금속 종류(6), 2단계 폴더 = 처리 조건(10) = 처리 방법(5) x 온도(2)

paths:
  image_root: ".."                                                    # AGG_labeled_only (읽기 전용)
  tiles_csv: "outputs/g00_tile_list/tiles.csv"                        # g00 이 만든 타일 목록 (selected==1 이 분석 타일)
  manifest_csv: "../preproc/outputs/s00b_meta_mag/manifest_v1.csv"
  masks_dir: ["C:/Users/<USER>/Downloads/AGG/data/ML_preproc/outputs/m01_masks/masks", "/mnt/c/Users/<USER>/Downloads/AGG/data/ML_preproc/outputs/m01_masks/masks"]   # ML_preproc m01 시편 마스크 (읽기 전용)
  outputs_dir: "outputs"
  # 캐시된 공식 저장소/가중치 (커밋 불명, 2026-10-09 다운로드). 후보 목록: Windows 경로, WSL 에서 보이는 Windows 경로 (존재하는 첫 번째 사용)
  dinov2_repo_dir: ["~/.cache/torch/hub/facebookresearch_dinov2_main", "/mnt/c/Users/<USER>/.cache/torch/hub/facebookresearch_dinov2_main"]
  dinov2_checkpoint: ["~/.cache/torch/hub/checkpoints/dinov2_vitb14_pretrain.pth", "/mnt/c/Users/<USER>/.cache/torch/hub/checkpoints/dinov2_vitb14_pretrain.pth"]

data:
  use_mag: "10"
  expected_tiles: 2591                                 # g00 이 고른 분석 타일 수 (겹치지 않는 부분 격자, 시편 픽셀 0 제외)
  expected_images: 60
  labels: [0, 1, 2]
  scalebar_exclude_box: [1670, 1277, 1824, 1368]       # preproc/config.yaml 의 scalebar.exclude_box 와 동일 (whole_image 겹침 로그용)

conditions:                                             # 2단계 폴더명 파싱 규칙(R1): '-' 가 있으면 첫 '-' 로 (방법, 온도), 없으면 ^(NPH)(\d{4})$
  methods: [NPH, PH1180, PH1205, PH1230, PH1255]
  temps: ["1035", "1050"]
  metals: [BASE, BASE-LC, BASE-LCSI, BASE-LSi, REF, REF-LN]
  images_per_condition: 6                               # 금속 6종에서 1장씩

cv:
  n_splits: 5
  n_repeats: 10
  seed: 0

model:
  name: dinov2_vitb14
  tile_input: 224
  normalization: imagenet                               # 공식 repo(dinov2/data/transforms.py)의 IMAGENET_DEFAULT_MEAN/STD 와 코드로 대조
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  expected_params_million: 86.6                         # 허용 오차 +-0.5
  batch_size: 64
  repo_provenance: "커밋 불명, 2026-10-09 다운로드"       # 사용자 결정 A: 캐시 그대로 사용, sha256 목록으로 검증

experiment:
  features: [cls, cls+patchmean]
  aggregators: [mean, mean_std, max]                    # mean_std 의 표준편차는 ddof=0
  classifiers: [logreg, knn]
  logreg:
    C: 1.0
    class_weight: balanced
    max_iter: 1000                                      # 명세에 없는 값: 수렴용(모델 정의는 불변). 수렴 경고 횟수를 로그에 남김
  knn:
    k: 5
    metric: cosine                                      # 표준화 없음 (명세 그대로)
    weights: distance
  sl_features: [cls, cls+patchmean]                     # SL: 타일 단위 logreg -> 이미지의 타일 확률 평균
  whole_image_classifiers: [logreg, knn]                # whole_image: 마스크 bbox 크롭(224 resize) cls + 같은 분류기
  primary: {features: cls, aggregator: mean, classifier: logreg}   # 결과를 보기 전에 고정. 바꾸지 않는다

bootstrap:
  n: 2000
  seed: 0
  note: "이미지 단위 CI 는 이미지가 독립이라는 가정이라 같은 처리 조건 안의 상관 때문에 실제보다 좁다. 클러스터 CI 는 처리 조건 10개를 복원추출."

permutation:                                            # e05
  n_permutations: 20
  seed: 0
  criteria:                                             # 제안값이며 데이터에서 유도한 값이 아니다
    macro_f1_center: 0.33
    macro_f1_tolerance: 0.10
    macro_f1_max_single_run: 0.55

permutation_extra:                                      # e07: e05 와 같은 순열(seed, 기준)을 다른 설정에도 적용. 기준을 어기면 멈추고 보고
  settings: ["whole_image|cls|logreg", "whole_image|cls|knn", "SL|cls+patchmean|logreg"]

expected_reference:                                     # R5: 손 계산 기대값 (다르면 멈추지 않고 로그에 알림)
  condition_memorization_correct: 54
  condition_memorization_n: 60
  condition_memorization_macro_f1: 0.893
  macro_f1_tolerance: 0.005
  discordant_n: 6
  discordant_by_metal: {BASE-LCSI: 4, BASE-LSi: 1, REF-LN: 1}
  ties: 0

g00:                                                    # g00_make_tile_list.py: ML_preproc 의 격자 전체(9,900개)에서 분석 타일을 고르는 규칙 (모든 이미지 동일, 라벨 무관)
  source_tiles_csv: ["C:/Users/<USER>/Downloads/AGG/data/ML_preproc/outputs/m02_tiles/tiles.csv", "/mnt/c/Users/<USER>/Downloads/AGG/data/ML_preproc/outputs/m02_tiles/tiles.csv"]
  source_tiles_sha256_prefix: "eb9899d3d072"             # ML_preproc README 에 기록된 tiles.csv sha256 앞부분
  expected_grid_tiles: 9900                             # 60 x 165 (224px, stride 112, 이미지당 15x11)
  select: nonoverlap_best_phase                         # stride 112 격자에서 서로 겹치지 않는 stride 224 부분 격자 4개 중 시편 픽셀을 가장 많이 덮는 것 (이미지마다 하나, 동률이면 앞 번호)
  drop_zero_mask: true                                  # 시편 픽셀이 0인 타일 (mask_px == 0) 제외
  reference_selected_ids_sha256: "7d8a1a21ec0f98e7047ee682b62d33182aec5c07e21d1b4be0f61dec6c6c7f41"   # 배경 증강 실험(b00)이 고른 같은 규칙의 타일 목록 sha256 (같은 선택인지 대조)

forbidden_terms: ["시편 종류"]                          # 스크립트/로그/보고서에서 쓰지 않는 말
