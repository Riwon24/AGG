# JEVision 타일 점수를 DINOv2_grid_augmentation 의 분석 타일 2,591개로 계산해 이진(AGG0+AGG1 vs AGG2)으로 평가하는 설정. config_bin.yaml 과 같고 타일 입력과 출력 폴더만 다르다. 로컬 확인용 (저장소에 올리지 않음).
paths:
  tiles_rerun: "outputs/jv01_binary_agg2_grid/input/tiles_grid_v1.jsonl"       # jv02_run_grid_tiles.py 결과 (WSL ~/jevision_work/results/tiles_grid_v1.jsonl 의 사본)
  conditions_csv: "../exp/outputs/e00_make_splits/conditions.csv"
  splits_csv: "../exp/outputs/e00_make_splits/splits.csv"
  outputs_dir: "outputs/jv01_binary_agg2_grid"

grid_mode: true                                          # 기존 1,514타일 결과와의 재실행 비교, README AUROC 재현 검사를 하지 않는다

data:
  expected_images: 60
  expected_tiles: 2591
  positive_labels: [2]

scores: [mean_flat, frac_flat]
primary_score: mean_flat
cv: {n_splits: 5, n_repeats: 10, seed: 0}
bootstrap: {n: 2000, seed: 0}
permutation: {n_permutations: 20, seed: 0}
forbidden_terms: ["시편 종류"]
