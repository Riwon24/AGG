# 배경 증강 실험 설정. 모든 b-스크립트가 이 파일 하나에서 파라미터를 읽는다 (하드코딩 금지).
# 상대경로는 이 config 파일이 있는 폴더(exp_bgaug/) 기준. 리스트는 후보 경로(Windows, WSL)이며 존재하는 첫 번째를 쓴다.
# 용어: 1단계 폴더 = 금속 종류(6), 2단계 폴더 = 처리 조건(10) = 처리 방법(5) x 온도(2)
paths:
  image_root: ".."                                       # AGG_labeled_only (이미지, 읽기 전용)
  tiles_csv: ["C:/Users/<USER>/Downloads/AGG/data/ML_preproc/outputs/m02_tiles/tiles.csv", "/mnt/c/Users/<USER>/Downloads/AGG/data/ML_preproc/outputs/m02_tiles/tiles.csv"]
  masks_dir: ["C:/Users/<USER>/Downloads/AGG/data/ML_preproc/outputs/m01_masks/masks", "/mnt/c/Users/<USER>/Downloads/AGG/data/ML_preproc/outputs/m01_masks/masks"]
  manifest_csv: "../preproc/outputs/s00b_meta_mag/manifest_v1.csv"
  splits_csv: "../exp/outputs/e00_make_splits/splits.csv"   # 기존 실험의 이미지 단위 분할을 그대로 재사용 (읽기 전용)
  outputs_dir: "outputs"
  # 캐시된 공식 DINOv2 저장소/가중치 (exp 와 같은 파일, 읽기 전용). 후보 목록: WSL 홈 캐시, Windows 캐시를 WSL 에서 본 경로
  dinov2_repo_dir: ["~/.cache/torch/hub/facebookresearch_dinov2_main", "/mnt/c/Users/<USER>/.cache/torch/hub/facebookresearch_dinov2_main"]
  dinov2_checkpoint: ["~/.cache/torch/hub/checkpoints/dinov2_vitb14_pretrain.pth", "/mnt/c/Users/<USER>/.cache/torch/hub/checkpoints/dinov2_vitb14_pretrain.pth"]
  exp_dir: "../exp"                                      # 기존 실험 폴더 (출처 검증용 해시, 비교용 특징을 읽기 전용으로 사용)

tiles:
  # 특징 추출(b03)은 항상 격자 전체 9,900개(224px, stride 112)에 대해 한다. 아래는 b04 이후 분석에 쓸 타일 선택 규칙 (모든 이미지 동일, 라벨 무관).
  select: nonoverlap_best_phase                         # 사용자 결정(2026-10-20): 겹치지 않게(stride 224 부분 격자 4개 중 시편 픽셀을 가장 많이 덮는 것), 배경은 포함하고 증강
                                                        # all_grid = 격자 전체(50% 겹침) | selected = m02 의 mask_frac >= 0.5 (7,921개)
  drop_zero_mask: true                                  # 시편 픽셀이 0인 타일(mask_px == 0)은 뺀다

data:
  expected_images: 60
  expected_tiles: 9900                                  # 60 x 165 (특징 추출 대상 격자 전체)
  expected_class_tiles: {0: 4620, 1: 2310, 2: 2970}
  expected_tiles_by_mask: {full: 5597, partial: 3772, none: 531}   # 마스크 100% / 일부 / 0% (tiles.csv 의 mask_frac 기준)
  tiles_sha256_prefix: "eb9899d3d072"                   # ML_preproc README 에 기록된 tiles.csv sha256 앞부분
  expected_resolution: [1824, 1368]                     # (w, h)
  scalebar_exclude_box: [1670, 1277, 1824, 1368]        # x0, y0, x1, y1 (배경 측정에서만 제외, 증강은 마스크 밖이면 이 구역도 포함)

bgaug:
  seed: 0
  n_aug: 5                                              # K: 이미지당 증강본 수 (k=1..K, k=0 은 원본)
  buffer_px: 8                                          # 마스크 밖 이 거리까지는 원본 유지 (마스크 오류 완충)
  feather_candidates_px: [0, 16]                        # 0 = 완충 띠 바로 바깥에서 교체, 16 = 그 바깥 16px 구간에서 알파 블렌딩 (b02 가 둘 다 점검)
  feather_px: 16                                        # 선택값 (2026-10-20, b02 확인용 그림): 0px 은 시편 경계 옆에 원본 배경의 어두운 띠가 합성 영역과 구분되어 보였고(링),
                                                        # 16px 은 그 경계가 부드럽게 이어졌다. 링 기울기 지표(ring_ratio)는 노이즈 기울기에 묻혀 못 잡았다.
                                                        # 노이즈를 평균으로 지운 b02c 지표(밝기 프로파일 급변 z>3): feather 0px 209/300(70%), 16px 19/300(6%) -> 16px 유지.
  lowfreq_sigma_px: 40                                  # 합성 배경의 저주파 색 장 크기
  lowfreq_downscale: 8                                  # 저주파 장을 1/8 해상도에서 만들어 키운다 (속도)
  measure_margin_px: 6                                  # 배경 측정은 d > buffer + 이 값 인 픽셀에서만 (경계 오염 방지)
  hf_blur_sigma_px: 2.0                                 # 미세 노이즈 = 이미지 - 이 σ 로 흐린 이미지
  mid_hi_sigma_px: 8                                    # 중간 대역 질감 = σ(hf) 흐림 - 이 σ 흐림 (배경 얼룩 크기)
  min_bg_px: 5000                                       # 측정 가능한 배경 픽셀이 이보다 적으면 경고
  ring_ratio_threshold: 1.5                             # 링 판정 제안값(데이터에서 유도한 값 아님): 증강본의 링 경계 기울기가 원본의 이 배수보다 크면 링이 보인다고 본다
  ring_z_threshold: 3.0                                 # b02c 링 판정 제안값(데이터에서 유도한 값 아님): 거리별 평균 프로파일의 1px 급변이 원본의 평소 변동보다 이 배수 이상 크면 링이 있다고 본다

model:                                                  # exp/config.yaml 과 같은 값 (정규화는 e01 meta.json 의 검증 결과와 대조)
  name: dinov2_vitb14
  tile_input: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  expected_params_million: 86.6
  batch_size: 64

cv:                                                     # 기존 e00 분할(splits_csv)을 그대로 쓴다. 값은 기록용 (assert 로 대조)
  n_splits: 5
  n_repeats: 10
  seed: 0

experiment:                                             # 설정은 결과를 보기 전에 고정. exp/config.yaml 의 primary 와 같은 설정 + 비교용 2개
  features: [cls, cls+patchmean]
  aggregator: mean
  classifiers: [logreg, knn]
  settings:                                             # primary 1개 + ablation 2개 (모두 합치기 mean)
    - {features: cls, classifier: logreg}               # primary
    - {features: cls+patchmean, classifier: logreg}
    - {features: cls, classifier: knn}
  primary: {features: cls, aggregator: mean, classifier: logreg}
  logreg: {C: 1.0, class_weight: balanced, max_iter: 1000}
  knn: {k: 5, metric: cosine, weights: distance}
  arms:                                                 # train/test 에 쓰는 버전 (0 = 원본, 1..K = 증강본). 이미지 단위 분할 안에서 한 이미지의 모든 버전은 같은 쪽에 들어간다
    R0: {train: orig, test: orig}                       # 증강 없음
    R1: {train: all, test: orig}                        # primary: 원본+증강본으로 학습, 원본으로 평가
    R2: {train: all, test: aug}                         # 원본+증강본으로 학습, 증강본(k 평균 확률)으로 평가
    R3: {train: orig, test: aug}                        # 원본으로 학습, 증강본으로 평가 (배경을 바꾸면 점수가 떨어지는지)
  primary_arm: R1

bootstrap:
  n: 2000
  seed: 0

permutation:                                            # b04b: exp/e05 와 같은 순열 검사를 primary 설정, primary 팔(R1)에 적용
  n_permutations: 20
  seed: 0
  criteria:                                             # 제안값이며 데이터에서 유도한 값이 아니다
    macro_f1_center: 0.33
    macro_f1_tolerance: 0.10
    macro_f1_max_single_run: 0.55

forbidden_terms: ["시편 종류"]
