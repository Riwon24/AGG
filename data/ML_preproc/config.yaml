# ML_preproc 설정. 모든 스크립트가 이 파일 하나에서 파라미터를 읽는다 (하드코딩 금지).
# 상대경로는 이 config 파일이 있는 폴더(ML_preproc/) 기준.
paths:
  outputs_dir: "outputs"

# 기존 preproc 파이프라인(읽기 전용으로만 사용): 이미지 루트, s02/s03 출력, 마스크 파라미터를 여기서 가져온다.
# 이 PC 의 절대경로이므로 다른 PC 에서는 바꿔야 한다.
preproc:
  config: "C:/Users/admin/Downloads/260929_images_for_AGG - manual labeling/AGG_labeled_only/preproc/config.yaml"

# 타일 좌표 (m02_tiles.py). 224px 타일을 stride 224px 로 (0,0) 에서 겹치지 않게 깐다 (이미지당 8 x 6 = 48개, 오른쪽 32px 와 아래 24px 는 쓰지 않음).
# 이전 설계(2026-10-15)는 stride 112px(50% 겹침, 165개/장)였는데, 분석에서는 그중 겹치지 않는 부분 격자(60장 모두 (0,0) 에서 시작하는 stride 224 격자)만 썼으므로
# 격자 자체를 stride 224 로 바꿨다 (2026-10-24, 사용자 결정). 선택 = 타일 안에 시편(마스크) 픽셀이 하나라도 있는 타일 (min_mask_frac 0).
# 마스크 침식 마진은 쓰지 않는다. 패치 라벨은 없고 이미지 라벨(0/1/2)을 이미지 단위로 유지한다. 특징은 마스크 안쪽 픽셀만 쓴다 (특징 추출 단계에서 구현).
tiling:
  tile_size: 224
  stride: 224                        # 224 = 겹침 없음 (이전 112 = 50% 겹침)
  min_mask_frac: 0                   # 0 이면 시편 픽셀이 1개 이상인 타일을 선택, 0 보다 크면 마스크 비율 >= 값 (이전 값 0.5)
  out_name: "m02_tiles_s224"         # outputs/<out_name>/ 에 저장 (stride 112 결과 outputs/m02_tiles/ 는 이전 실험의 입력이라 그대로 둔다)
  grid_origin: top_left              # 격자는 (0,0) 에서 시작, 오른쪽/아래 남는 픽셀은 쓰지 않음
  qc_images_per_class: 1             # 격자 overlay PNG: 클래스별 마스크 면적 중앙값에 가까운 이미지 수

# 픽셀별 점수 항 (감점 전용). 점수 = A + lambda_blue*(B-1) + lambda_prox*(P-1), 점수 > 0 이 시편.
score_map:
  sigma_v: 20                        # A = tanh((V - Otsu 임계값) / sigma_v), 밝기 (기존 otsu_v 와 같은 방향)
  sigma_h: 8                         # B: 핵심부 색상 H 중앙값 중심 가우시안 폭 (OpenCV H 0~179)
  s_lo: 10                           # B: 채도 문. S <= s_lo 이면 0, S >= s_hi 이면 1 (사이는 선형)
  s_hi: 40
  tau_px: 40                         # P = exp(-max(d - d0, 0)/tau), d = hue_sv 핵심부까지 거리 (px)
  lambda_blue: 0.5                   # 파랑이 아닐수록 감점
  lambda_prox: 1.5                   # 핵심부에서 멀수록 감점

# 최종 시편 마스크. 이미지별로 baseline/plateau 를 고른다 (규칙은 모든 이미지에 동일).
#   otsu_v 마스크 안쪽 V(명도) 중앙값 >= v_med_threshold 이면 plateau, 아니면 baseline.
#   근거: 두 변형이 크게 다른 7장에서 어두운 쪽 V 중앙값은 104, 116 / 밝은 쪽은 152 이상 (117~151 구간에 이미지 없음).
final_mask:
  v_med_threshold: 135
  variants:
    baseline: {penalty_only: true}
    plateau:  {penalty_only: true, prox_plateau_px: 50}   # d0 = 50: 핵심부에서 50px 까지 근접 감점 없음 (흰 띠 폭 약 40~50px 보존)
  per_file: 6                        # 확인용 PNG 한 장에 넣을 이미지 수
  cols: 3                            # 확인용 PNG 열 수
  tile_w: 600
